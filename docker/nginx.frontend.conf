server {
    listen 80;
    server_name www.dealdost.shop;
    return 301 https://dealdost.shop$request_uri;
}

server {
    listen 80 default_server;
    server_name dealdost.shop _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               application/xml application/xml+rss image/svg+xml application/manifest+json;

    # Real static files (robots.txt, sitemap.xml, icons, manifest, hashed assets) are served
    # as-is with correct content-types; only unmatched paths fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets: safe to cache indefinitely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html and the PWA service worker must always be revalidated so users
    # pick up new deploys instead of pinning a stale shell/cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* ^/(sw|workbox-.*|registerSW)\.js$ {
        add_header Cache-Control "no-cache";
    }

    location = /robots.txt {
        try_files $uri =404;
        default_type text/plain;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        default_type application/xml;
    }
}
